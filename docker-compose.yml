services:
  db: {image: postgres:16, environment: {POSTGRES_DB: bluecarbon, POSTGRES_USER: bluecarbon, POSTGRES_PASSWORD: change-me}, volumes: [pgdata:/var/lib/postgresql/data], ports: ["5432:5432"]}
  backend: {build: ./backend, environment: {DATABASE_URL: postgresql+psycopg://bluecarbon:change-me@db:5432/bluecarbon, SECRET_KEY: change-me, CORS_ORIGINS: http://localhost:5173}, volumes: [uploads:/app/uploads], ports: ["8000:8000"], depends_on: [db]}
  frontend: {build: ./frontend, ports: ["5173:80"], depends_on: [backend]}
volumes: {pgdata: {}, uploads: {}}
